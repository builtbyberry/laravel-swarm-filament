name: tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel 13 - ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
        dependencies:
          - lowest
          - published-0.25
          - adoption-minimum
          - adoption-current

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Preserve original manifest for guard tests
        run: cp composer.json "$RUNNER_TEMP/filament-composer.json"

      - name: Prepare published baseline
        if: matrix.dependencies == 'published-0.25'
        run: php .github/scripts/compatibility.php prepare published-0.25

      # This manifest and archive are pinned candidate inputs, not a published tag.
      - name: Prepare pinned core candidate
        if: startsWith(matrix.dependencies, 'adoption-')
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/builtbyberry/laravel-swarm/e25842cab4291837dcce2ff6f4815e58feab9079/composer.json \
            --output "$RUNNER_TEMP/core-candidate.json"
          php .github/scripts/compatibility.php prepare '${{ matrix.dependencies }}' "$RUNNER_TEMP/core-candidate.json"

      - name: Install current stable dependencies
        if: matrix.dependencies == 'published-0.25' || matrix.dependencies == 'adoption-current'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest' || matrix.dependencies == 'adoption-minimum'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Test dependency evidence guards
        run: php .github/scripts/compatibility-test.php "$RUNNER_TEMP/filament-composer.json"

      - name: Verify installed and locked dependencies
        run: php .github/scripts/compatibility.php verify '${{ matrix.dependencies }}'

      - name: Execute tests
        run: composer test

      - name: Execute static analysis
        if: matrix.dependencies == 'published-0.25' || matrix.dependencies == 'adoption-current'
        run: |
          vendor/bin/phpstan clear-result-cache
          composer analyse

      - name: Execute code style check
        if: matrix.dependencies == 'published-0.25' || matrix.dependencies == 'adoption-current'
        run: composer lint
