name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel 13 - ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'
        dependencies:
          - stable-latest
          - lowest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Install dependencies
        if: matrix.dependencies == 'stable-latest'
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Verify published PHP 8.4 core
        if: matrix.php == '8.4'
        shell: bash
        run: |
          version=$(composer show --format=json builtbyberry/laravel-swarm | jq -er '.versions[0]')
          echo "Resolved Laravel Swarm version: $version"

          if [[ "$version" != "v0.25."* ]]; then
            echo "::error::Expected a published Laravel Swarm v0.25 release on PHP 8.4, resolved $version."
            exit 1
          fi

      - name: Execute tests
        run: composer test

      - name: Execute static analysis
        if: matrix.dependencies == 'stable-latest'
        run: composer analyse

      - name: Execute code style check
        if: matrix.dependencies == 'stable-latest'
        run: composer lint
